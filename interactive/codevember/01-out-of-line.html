<a class="back" href="/codevember.html">← Codevember</a>
<script type="module">
// 01 · OUT OF LINE
// Two plates of the same words. The blue plate slips out of register on the beat
// and locks back. Drag it yourself; let go and it snaps home.
import { setup, paper, print, credit, makePlate, fitSize, run, ease, INK, W, H, DISPLAY, font } from './lib.js';

const k = await setup();
const LOOP = 8;
const LINES = ['OUT', 'OF', 'LINE.'];

// Fit the width, but never let the block run into the credit line.
const size = Math.min(fitSize(k.ctx, DISPLAY, LINES, W - 150), Math.floor((H - 340) / (0.78 + 0.86 * 2)));
const lead = size * 0.86;
const top = 110 + size * 0.78;

function words(color) {
  const p = makePlate();
  const g = p.getContext('2d');
  g.fillStyle = color;
  g.font = font(DISPLAY, size);
  g.letterSpacing = `${-size * 0.02}px`;
  LINES.forEach((l, i) => g.fillText(l, 72, top + i * lead));
  return p;
}
const pink = words(INK.pink);
const blue = words(INK.blue);

// Where the blue plate sits at each beat. It moves fast, then holds dead still.
const KEYS = [
  [0.0, 0, 0],
  [1.4, 22, -12],
  [2.8, -64, 40],
  [4.2, 150, -26],
  [5.6, -8, 210],
  [7.0, 0, 0],
];
const SNAP = 0.16;

function plateAt(t) {
  let prev = KEYS[0];
  for (const key of KEYS) {
    if (t < key[0]) break;
    prev = key;
  }
  const i = KEYS.indexOf(prev);
  const before = KEYS[i - 1] || prev;
  const e = ease((t - prev[0]) / SNAP);
  return [before[1] + (prev[1] - before[1]) * e, before[2] + (prev[2] - before[2]) * e];
}

// Drag the blue plate. On release it springs back to the beat.
let drag = null, held = [0, 0], release = null;
const toCanvas = (e) => {
  const r = k.c.getBoundingClientRect();
  return [(e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height)];
};
k.c.addEventListener('pointerdown', (e) => { drag = { from: toCanvas(e) }; k.c.setPointerCapture(e.pointerId); });
k.c.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const [x, y] = toCanvas(e);
  held = [x - drag.from[0], y - drag.from[1]];
});
k.c.addEventListener('pointerup', () => { drag = null; release = { at: performance.now(), from: held }; });

function render(t) {
  let [dx, dy] = plateAt(t);
  if (drag) {
    dx += held[0];
    dy += held[1];
  } else if (release) {
    const e = ease((performance.now() - release.at) / 220);
    dx += release.from[0] * (1 - e);
    dy += release.from[1] * (1 - e);
    if (e >= 1) release = null;
  }
  paper(k);
  print(k, pink);
  print(k, blue, Math.round(dx), Math.round(dy));
  credit(k, 'Two inks. The third colour is where they overlap.', '01');
}

run(k, LOOP, render, '01-out-of-line');
</script>
</body>

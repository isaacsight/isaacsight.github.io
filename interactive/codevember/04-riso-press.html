<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riso Press — Codevember — Isaac Hernandez</title>
<link rel="canonical" href="https://isaacsight.com/interactive/codevember/04-riso-press.html">
<link rel="stylesheet" href="lib.css?v=2">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px 16px; box-sizing: border-box; }
  canvas { cursor: default; width: min(calc(100vw - 32px), calc((100dvh - var(--bar, 120px) - 40px) * 0.8)); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: center; max-width: 1080px;
         font: 400 14px/1.2 Text, Arial, sans-serif; color: #3d63b8; }
  .bar button, .bar label.btn, .bar input[type=text] {
    font: inherit; color: #3d63b8; background: #f3eee3; border: 1.5px solid #3d63b8; border-radius: 0;
    padding: 8px 12px; cursor: pointer; }
  .bar input[type=text] { cursor: text; width: 200px; text-transform: uppercase; }
  .bar button[aria-pressed=true] { background: #3d63b8; color: #f3eee3; }
  .bar .group { display: flex; gap: 0; }
  .bar .group button + button { border-left: 0; }
  .bar .main { background: #ff48b0; border-color: #ff48b0; color: #141414; }
  .bar input[type=file] { display: none; }
  .drop { outline: 3px dashed #ff48b0; outline-offset: -10px; }
</style>
</head>
<body>
<a class="back" href="/codevember.html">← Codevember</a>
<div class="bar" id="bar">
  <label class="btn main">Choose a photo<input type="file" id="file" accept="image/*"></label>
  <input type="text" id="words" maxlength="18" value="GOLDEN HOUR" aria-label="Headline">
  <span class="group" role="group" aria-label="Shape">
    <button data-shape="circle" aria-pressed="true">Circle</button><button data-shape="arch" aria-pressed="false">Arch</button><button data-shape="full" aria-pressed="false">Full</button>
  </span>
  <span class="group" role="group" aria-label="Type ink">
    <button data-ink="pink" aria-pressed="true">Pink type</button><button data-ink="blue" aria-pressed="false">Blue type</button>
  </span>
  <button id="again">Print again</button>
  <button id="save">Download</button>
</div>
<script type="module">
// 04 · RISO PRESS
// Choose any photo. It is pulled into two inks the way a risograph would print it:
// blue takes the shadows and cool tones, pink takes the warm ones, each as a
// grain of dots. The two plates go down one after the other, a little out of line.
import { setup, credit, makePlate, fitSize, run, ease, rng, INK, W, H, DISPLAY, font } from './lib.js?v=2';

const k = await setup();
const { ctx, c } = k;
const bar = document.getElementById('bar');
document.body.appendChild(bar); // controls sit under the poster

// Keep the poster on screen above the controls (CSS does the sizing; JS only reports the bar height).
const fit = () => document.documentElement.style.setProperty('--bar', bar.offsetHeight + 'px');
addEventListener('resize', fit);
fit();

const LOOP = 9;
const CELL = 2;                          // one ink dot = 2×2 px
const GW = W / CELL, GH = H / CELL;      // plate grid
const BLUE_AT = [0.5, 2.0], PINK_AT = [2.4, 3.9], TYPE_AT = 4.3;

const opts = { shape: 'circle', ink: 'pink', words: 'GOLDEN HOUR', seed: 7 };
let photo = null;
let plates = null; // { blue, pink, off: {blue:[x,y], pink:[x,y]} }

// The window the photo is printed into. Shapes, not full-frame pictures.
function shapePath(g, s = 1) {
  g.beginPath();
  if (opts.shape === 'circle') {
    g.arc(540 / s, 520 / s, 430 / s, 0, Math.PI * 2);
  } else if (opts.shape === 'arch') {
    const x0 = 130 / s, x1 = 950 / s, top = 70 / s, bot = 1010 / s, r = (x1 - x0) / 2;
    g.moveTo(x0, bot);
    g.lineTo(x0, top + r);
    g.arc(x0 + r, top + r, r, Math.PI, 0);
    g.lineTo(x1, bot);
    g.closePath();
  } else {
    g.rect(64 / s, 64 / s, (W - 128) / s, 946 / s);
  }
}

// Pull the photo into two plates of dots.
function separate() {
  const src = makePlate(GW, GH);
  const g = src.getContext('2d', { willReadFrequently: true });
  g.save();
  shapePath(g, CELL);
  g.clip();
  // cover-fit the photo into the shape's bounding box
  const box = opts.shape === 'circle' ? [110, 90, 860, 860] : opts.shape === 'arch' ? [130, 70, 820, 940] : [64, 64, W - 128, 946];
  const [bx, by, bw, bh] = box.map((v) => v / CELL);
  const sc = Math.max(bw / photo.width, bh / photo.height);
  g.drawImage(photo, bx + (bw - photo.width * sc) / 2, by + (bh - photo.height * sc) / 2, photo.width * sc, photo.height * sc);
  g.restore();
  const px = g.getImageData(0, 0, GW, GH).data;

  // Auto levels from the photo's own lightness range.
  const lum = new Float32Array(GW * GH);
  const hist = [];
  for (let i = 0; i < GW * GH; i++) {
    if (px[i * 4 + 3] < 128) { lum[i] = -1; continue; }
    const l = (0.2126 * px[i * 4] + 0.7152 * px[i * 4 + 1] + 0.0722 * px[i * 4 + 2]) / 255;
    lum[i] = l;
    hist.push(l);
  }
  hist.sort((a, b) => a - b);
  const lo = hist[Math.floor(hist.length * 0.02)] ?? 0, hi = hist[Math.floor(hist.length * 0.98)] ?? 1;

  const r = rng(opts.seed * 97 + 13);
  const blue = makePlate(GW, GH), pink = makePlate(GW, GH);
  const bi = blue.getContext('2d').createImageData(GW, GH), pi = pink.getContext('2d').createImageData(GW, GH);
  const [br, bgc, bb] = [0x3d, 0x63, 0xb8], [pr, pgc, pb] = [0xff, 0x48, 0xb0];
  const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
  for (let i = 0; i < GW * GH; i++) {
    if (lum[i] < 0) continue;
    const L = Math.min(Math.max((lum[i] - lo) / (hi - lo || 1), 0), 1);
    const R = px[i * 4], B = px[i * 4 + 2];
    const warm = Math.min(Math.max((R - B) / 255 * 3.6, 0), 1);
    const cool = Math.min(Math.max((B - R) / 255 * 2.4, 0), 1);
    const dark = 1 - L;
    // Blue carries the shadows and the cool tones, and steps back where the photo is warm.
    const aBlue = Math.min(1, (smooth(0.15, 1, dark) * 0.9 + cool * 0.35 * (1 - L * 0.4)) * (1 - 0.45 * warm));
    // Pink carries the warm tones, plus a little lift in the mid-shadows.
    const aPink = Math.min(1, warm * 0.95 * (1 - 0.25 * L) + smooth(0.35, 1, dark) * 0.25);
    if (aBlue > r()) { bi.data.set([br, bgc, bb, 255], i * 4); }
    if (aPink > r()) { pi.data.set([pr, pgc, pb, 255], i * 4); }
  }
  blue.getContext('2d').putImageData(bi, 0, 0);
  pink.getContext('2d').putImageData(pi, 0, 0);
  const jitter = () => Math.round((r() - 0.5) * 12);
  plates = { blue, pink, off: { blue: [jitter(), jitter()], pink: [jitter(), jitter()] } };
}

// The type, set sharp on its own plate in one ink.
function typePlate() {
  const p = makePlate();
  const g = p.getContext('2d');
  const words = (opts.words || ' ').toUpperCase();
  const size = Math.min(fitSize(g, DISPLAY, [words], W - 128), 230);
  g.font = font(DISPLAY, size);
  g.letterSpacing = `${-size * 0.015}px`;
  g.fillStyle = INK[opts.ink];
  g.fillText(words, 64, 1170);
  return p;
}
let words = null;

// Print one plate, revealed by the roller as it passes down the sheet.
function pass(plate, off, t, [a, b], scaleUp) {
  const e = ease((t - a) / (b - a));
  if (e <= 0) return;
  const edge = e * (H + 40);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, edge);
  ctx.clip();
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = 0.94;
  ctx.imageSmoothingEnabled = false;
  if (scaleUp) ctx.drawImage(plate, off[0], off[1], W, H);
  else ctx.drawImage(plate, off[0], off[1]);
  ctx.restore();
  // The roller itself: a thin line of the ink at the leading edge while it runs.
  if (e < 1) {
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = plate === plates.blue ? INK.blue : INK.pink;
    ctx.fillRect(0, edge - 3, W, 3);
    ctx.restore();
  }
}

function render(t) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = INK.paper;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = 0.55;
  ctx.drawImage(k.grain, 0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  if (!plates) return;

  pass(plates.blue, plates.off.blue, t, BLUE_AT, true);
  pass(plates.pink, plates.off.pink, t, PINK_AT, true);

  if (t >= TYPE_AT) {
    const e = ease((t - TYPE_AT) / 0.14);
    const off = plates.off[opts.ink];
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = 0.94;
    ctx.drawImage(words, off[0], off[1] + (1 - e) * 26);
    ctx.restore();
  }
  credit(k, 'Your photo, pulled into two inks.', '04');
}

// --- Controls
function load(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
const note = document.createElement('span');
note.setAttribute('role', 'status');
note.style.cssText = 'flex-basis:100%;text-align:center;min-height:1em';
bar.appendChild(note);
async function usePhoto(src) {
  try {
    photo = await load(src);
  } catch {
    // e.g. an iPhone HEIC file, which browsers can't open
    note.textContent = 'That photo didn’t open. Try a JPG or PNG.';
    return;
  }
  note.textContent = '';
  separate();
  k.restart(0);
}
document.getElementById('file').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) usePhoto(URL.createObjectURL(f));
});
addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('drop'); });
addEventListener('dragleave', () => document.body.classList.remove('drop'));
addEventListener('drop', (e) => {
  e.preventDefault();
  document.body.classList.remove('drop');
  const f = [...e.dataTransfer.files].find((x) => x.type.startsWith('image/'));
  if (f) usePhoto(URL.createObjectURL(f));
});
const wordsInput = document.getElementById('words');
wordsInput.addEventListener('input', () => {
  opts.words = wordsInput.value;
  words = typePlate();
  k.restart(TYPE_AT + 0.2); // show the new line without reprinting the photo
});
wordsInput.addEventListener('keydown', (e) => e.stopPropagation()); // typing R here shouldn't record
for (const b of bar.querySelectorAll('[data-shape]')) b.addEventListener('click', () => {
  opts.shape = b.dataset.shape;
  bar.querySelectorAll('[data-shape]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  separate();
  k.restart(0);
});
for (const b of bar.querySelectorAll('[data-ink]')) b.addEventListener('click', () => {
  opts.ink = b.dataset.ink;
  bar.querySelectorAll('[data-ink]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  words = typePlate();
  k.restart(TYPE_AT + 0.2);
});
document.getElementById('again').addEventListener('click', () => {
  opts.seed++;
  separate();
  k.restart(0);
});
document.getElementById('save').addEventListener('click', () => {
  render(LOOP - 0.5);
  c.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'riso-press.png';
    a.click();
  });
});

words = typePlate();
run(k, LOOP, render, '04-riso-press');
window.ready = false; // the exporter waits until the sample photo is pressed
await usePhoto('assets/sample.jpg');
window.ready = true;
</script>
</body>
</html>

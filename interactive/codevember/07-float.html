<a class="back" href="/codevember.html">← Codevember</a>
<script type="module">
// 07 · FLOAT
// Suminagashi, the Japanese way of marbling: drops of ink float on water and push
// each other into rings, then a comb drags them into patterns. The shapes come
// from Aubrey Jaffer's marbling equations, so nothing is painted, only moved.
// Click to drop ink. Drag to comb. Press Space to start over.
import { setup, credit, run, ease, W, H, DISPLAY, font } from './lib.js?v=2';

const k = await setup();
const { ctx } = k;
const LOOP = 12;
const WATER = '#ebe4d3';
const INKS = ['#1a1a1d', WATER, '#d4432a', WATER, '#22386e', WATER];

let polys = [];
const CX = 540, CY = 590;

function drop(cx, cy, r, color) {
  const r2 = r * r;
  for (const p of polys) {
    const a = p.pts;
    for (let i = 0; i < a.length; i += 2) {
      const dx = a[i] - cx, dy = a[i + 1] - cy, d2 = dx * dx + dy * dy || 1e-6;
      const s = Math.sqrt(1 + r2 / d2);
      a[i] = cx + dx * s;
      a[i + 1] = cy + dy * s;
    }
  }
  const n = Math.max(120, Math.round(r * 3));
  const pts = new Array(n * 2);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    pts[i * 2] = cx + Math.cos(a) * r;
    pts[i * 2 + 1] = cy + Math.sin(a) * r;
  }
  polys.push({ color, pts });
}

// A single tine pulled along direction (mx,my) through (bx,by).
function tine(bx, by, mx, my, z, lam) {
  const nx = -my, ny = mx;
  for (const p of polys) {
    const a = p.pts;
    for (let i = 0; i < a.length; i += 2) {
      const d = Math.abs((a[i] - bx) * nx + (a[i + 1] - by) * ny);
      const f = (z * lam) / (d + lam);
      a[i] += f * mx;
      a[i + 1] += f * my;
    }
  }
}

// A comb: many parallel tines `spacing` apart.
function comb(mx, my, spacing, offset, z, lam) {
  const nx = -my, ny = mx;
  for (const p of polys) {
    const a = p.pts;
    for (let i = 0; i < a.length; i += 2) {
      let q = ((a[i] * nx + a[i + 1] * ny - offset) % spacing + spacing) % spacing;
      const d = Math.min(q, spacing - q);
      const f = (z * lam) / (d + lam);
      a[i] += f * mx;
      a[i + 1] += f * my;
    }
  }
}

// Keep edges short so stretched shapes stay smooth.
function refine() {
  for (const p of polys) {
    const a = p.pts;
    if (a.length > 12000) continue;
    const out = [];
    for (let i = 0; i < a.length; i += 2) {
      const x0 = a[i], y0 = a[i + 1], j = (i + 2) % a.length, x1 = a[j], y1 = a[j + 1];
      out.push(x0, y0);
      const L = Math.hypot(x1 - x0, y1 - y0), n = Math.min(Math.ceil(L / 5), 40);
      for (let s = 1; s < n; s++) out.push(x0 + ((x1 - x0) * s) / n, y0 + ((y1 - y0) * s) / n);
    }
    p.pts = out;
  }
}

// The score: drops first, then three passes of the comb, each split into steps
// so the result is the same at any frame rate.
const EVENTS = [];
for (let i = 0; i < 18; i++) EVENTS.push({ at: 0.4 + i * 0.22, fn: () => drop(CX, CY, 95, INKS[i % INKS.length]) });
EVENTS.push({ at: 4.5, fn: () => drop(250, 280, 70, INKS[2]) });
EVENTS.push({ at: 4.6, fn: () => drop(250, 280, 40, WATER) });
EVENTS.push({ at: 4.75, fn: () => drop(840, 960, 80, INKS[4]) });
EVENTS.push({ at: 4.85, fn: () => drop(840, 960, 46, WATER) });
EVENTS.push({ at: 4.95, fn: () => drop(830, 250, 52, INKS[0]) });
function stroke(a, b, steps, fn) {
  for (let s = 0; s < steps; s++) EVENTS.push({ at: a + ((b - a) * (s + 1)) / steps, fn: () => fn(1 / steps) });
}
stroke(5.3, 6.3, 30, (f) => tine(0, 560, 1, 0, 260 * f, 36));
stroke(6.4, 7.3, 30, (f) => tine(0, 720, -1, 0, 200 * f, 30));
stroke(7.4, 8.6, 36, (f) => comb(0, 1, 130, 65, 110 * f, 14));
EVENTS.sort((a, b) => a.at - b.at);

let next = 0, lastT = -1, manual = false;
function reset() { polys = []; next = 0; lastT = -1; }

function render(t) {
  if (!manual) {
    if (t < lastT) reset();
    lastT = t;
    let changed = false;
    while (next < EVENTS.length && EVENTS[next].at <= t) { EVENTS[next++].fn(); changed = true; }
    if (changed) refine();
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = WATER;
  ctx.fillRect(0, 0, W, H);
  for (const p of polys) {
    const a = p.pts;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    for (let i = 2; i < a.length; i += 2) ctx.lineTo(a[i], a[i + 1]);
    ctx.closePath();
    ctx.fill();
  }
  // the paper the print is lifted onto
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = 0.55;
  ctx.drawImage(k.grain, 0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  if (manual || t >= 9.0) {
    const e = manual ? 1 : ease((t - 9.0) / 0.14);
    ctx.fillStyle = '#1a1a1d';
    ctx.font = font(DISPLAY, 132);
    ctx.fillText('INK FLOATS.', 64, 1196 + (1 - e) * 24);
  }
  credit(k, 'Drops on water, pulled by a comb.', '07', '#1a1a1d', 'source-over');
}

// Click to drop ink, drag to comb, Space to start over.
let down = null, colorIx = 0;
const at = (e) => { const r = k.c.getBoundingClientRect(); return [(e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height)]; };
k.c.addEventListener('pointerdown', (e) => { manual = true; down = { p: at(e), moved: false }; try { k.c.setPointerCapture(e.pointerId); } catch {} });
k.c.addEventListener('pointermove', (e) => {
  if (!down) return;
  const p = at(e), dx = p[0] - down.p[0], dy = p[1] - down.p[1], L = Math.hypot(dx, dy);
  if (L < 6) return;
  tine(down.p[0], down.p[1], dx / L, dy / L, L * 0.9, 28);
  refine();
  down.p = p;
  down.moved = true;
});
k.c.addEventListener('pointerup', () => {
  if (down && !down.moved) {
    const ink = ['#1a1a1d', '#d4432a', '#22386e'][colorIx++ % 3];
    drop(down.p[0], down.p[1], 60, ink);
    drop(down.p[0], down.p[1], 30, WATER);
    refine();
  }
  down = null;
});
addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); manual = false; reset(); k.restart(); } });

run(k, LOOP, render, '07-float');
</script>
</body>

<!doctype html>
<html lang="en">

<title>Edition — Codevember — Isaac Hernandez</title>
<link rel="canonical" href="https://isaacsight.com/interactive/codevember/09-edition.html">
<link rel="stylesheet" href="lib.css?v=2">

<body>
<a class="back" href="/codevember.html">← Codevember</a>
<script type="module">
// 09 · EDITION
// A letterpress broadside in black and red wood type that reprints itself every
// hour with the real time and weather in Los Angeles. Each hour is its own
// numbered edition and is never printed again. Click to pull another proof.
import { setup, credit, makePlate, fitSize, run, ease, rng, W, H, DISPLAY, TEXT, font } from './lib.js?v=2';

const k = await setup();
const { ctx } = k;
const LOOP = 10;
const SHEET = '#efe8d8', BLACK = '#1c1a17', RED = '#c8331f';
const TZ = 'America/Los_Angeles';

// --- What this edition says: the hour in LA and the weather right now.
const now = new Date();
const part = (o) => new Intl.DateTimeFormat('en-US', { timeZone: TZ, ...o }).format(now);
const hour = part({ hour: 'numeric', hour12: true }).replace(' ', ' ').toUpperCase(); // "9 PM"
const dateLine = part({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
// Edition number: hours since Codevember began in LA.
const edition = Math.max(1, Math.floor((now - new Date('2026-11-01T07:00:00Z')) / 3600000) + 1);

const SKY = { 0: 'CLEAR', 1: 'MOSTLY CLEAR', 2: 'PARTLY CLOUDY', 3: 'OVERCAST', 45: 'FOG', 48: 'FOG', 51: 'DRIZZLE', 53: 'DRIZZLE', 55: 'DRIZZLE',
  61: 'RAIN', 63: 'RAIN', 65: 'HEAVY RAIN', 71: 'SNOW', 73: 'SNOW', 75: 'SNOW', 80: 'SHOWERS', 81: 'SHOWERS', 82: 'STORM', 95: 'THUNDER', 96: 'THUNDER', 99: 'THUNDER' };
let sky = 'LOS ANGELES', temp = '';
try {
  const ctl = new AbortController();
  setTimeout(() => ctl.abort(), 3500);
  const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.05&longitude=-118.24&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles', { signal: ctl.signal });
  const j = await r.json();
  sky = SKY[j.current.weather_code] || 'WEATHER';
  temp = Math.round(j.current.temperature_2m) + '°F';
} catch {
  // Offline or blocked: print the time alone rather than inventing weather.
}

// --- Ink texture: letterpress never inks perfectly, so the paper shows through.
let proof = 1, salt;
function makeSalt() {
  const r = rng(proof * 31 + 7);
  salt = makePlate();
  const g = salt.getContext('2d');
  g.fillStyle = '#000';
  for (let i = 0; i < 26000; i++) {
    const s = r() < 0.9 ? 1.2 : 2.4;
    g.fillRect(r() * W, r() * H, s, s);
  }
  // a few worn streaks along the grain of the wood
  for (let i = 0; i < 70; i++) g.fillRect(r() * W, r() * H, 1, 8 + r() * 30);
}

function forme(draw) {
  const p = makePlate(), g = p.getContext('2d');
  draw(g);
  g.globalCompositeOperation = 'destination-out';
  g.drawImage(salt, (proof * 37) % 23 - 11, (proof * 19) % 17 - 8);
  return p;
}

let black, red, nudge;
function setForms() {
  makeSalt();
  const r = rng(proof * 13);
  nudge = [Math.round((r() - 0.5) * 6), Math.round((r() - 0.5) * 6)];
  // Size the hour first so everything below it can sit right under it.
  const hs = Math.min(fitSize(ctx, DISPLAY, [hour], W - 128), 640);
  const hourBase = 200 + hs * 0.76, rule = hourBase + 64;
  black = forme((g) => {
    g.fillStyle = BLACK;
    g.fillRect(64, 84, W - 128, 6);
    g.fillRect(64, 96, W - 128, 2);
    g.font = font(TEXT, 28);
    g.fillText('LOS ANGELES', 64, 150);
    g.textAlign = 'right';
    g.fillText('EDITION No. ' + edition.toLocaleString('en-US'), W - 64, 150);
    g.textAlign = 'left';
    g.fillRect(64, 174, W - 128, 2);
    g.fillRect(64, rule, W - 128, 2);
    const ws = Math.min(fitSize(g, DISPLAY, [sky], W - 128), 250);
    g.font = font(DISPLAY, ws);
    g.fillText(sky, 60, rule + 40 + ws * 0.76);
    g.font = font(TEXT, 38);
    g.fillText([temp, dateLine].filter(Boolean).join('  ·  '), 64, rule + 40 + ws * 0.76 + 70);
    g.fillRect(64, 1150, W - 128, 2);
    g.fillRect(64, 1156, W - 128, 6);
  });
  red = forme((g) => {
    g.fillStyle = RED;
    g.font = font(DISPLAY, hs);
    g.letterSpacing = `${-hs * 0.01}px`;
    g.fillText(hour, 56, hourBase);
  });
}
setForms();

// The press: black goes down, then red, each with a short thump.
const BLACK_AT = 0.7, RED_AT = 2.1;
function pull(t, at) {
  if (t < at) return null;
  const e = ease((t - at) / 0.12);
  return 1.012 - 0.012 * e;
}

function render(t) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = SHEET;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = 0.6;
  ctx.drawImage(k.grain, 0, 0, W, H);
  ctx.globalAlpha = 1;
  for (const [plate, at, off] of [[black, BLACK_AT, [0, 0]], [red, RED_AT, nudge]]) {
    const s = pull(t, at);
    if (s === null) continue;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(s, s);
    ctx.translate(-W / 2 + off[0], -H / 2 + off[1]);
    ctx.globalAlpha = 0.95;
    ctx.drawImage(plate, 0, 0);
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
  credit(k, 'Printed every hour. This one won’t be printed again.', '09', BLACK, 'multiply');
}

k.c.addEventListener('pointerdown', () => { proof++; setForms(); k.restart(); });
run(k, LOOP, render, '09-edition');
</script>
</body>
</html>

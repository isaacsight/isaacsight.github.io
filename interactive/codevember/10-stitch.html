<script type="module">
// 10 · STITCH
// Cross-stitch on Aida cloth. The words are sewn one X at a time, the way it's
// done by hand: a row of half stitches one way, then back the other way to cross
// them. A navy running stitch frames it. Type a word and press Enter to sew it.
import { setup, credit, makePlate, fitSize, run, rng, W, H, DISPLAY, font } from './lib.js?v=2';

const k = await setup();
const { ctx } = k;
const LOOP = 12;
const CLOTH = '#f1ece0', HOLE = 'rgba(120,105,80,.22)';
const RED = '#b8322a', RED_HI = '#d65a4c', NAVY = '#22305a', NAVY_HI = '#3d4f86', GOLD = '#d9a23a', GOLD_HI = '#ecc56e';
const C = 18;                                   // one square of cloth
const COLS = Math.floor(W / C), ROWS = Math.floor(H / C);
const SEW = [0.3, 8.6];                         // when the needle is working

// The cloth: a woven grid with a hole at every corner.
const cloth = makePlate();
{
  const g = cloth.getContext('2d');
  g.fillStyle = CLOTH;
  g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,.35)';
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) g.fillRect(x * C + 3, y * C + 3, C - 6, C - 6);
  g.fillStyle = HOLE;
  for (let y = 0; y <= ROWS; y++) for (let x = 0; x <= COLS; x++) g.fillRect(x * C - 1.5, y * C - 1.5, 3, 3);
}

let word = 'MADE SLOW', plan;
function buildPlan() {
  const lines = word.trim().toUpperCase().split(/\s+/);
  const mask = makePlate(COLS, ROWS), m = mask.getContext('2d', { willReadFrequently: true });
  const size = Math.min(fitSize(m, DISPLAY, lines, COLS - 12), Math.floor((ROWS - 30) / lines.length / 0.92));
  m.font = font(DISPLAY, size);
  m.fillStyle = '#000';
  const blockH = size * 0.76 + (lines.length - 1) * size * 0.92;
  const top = Math.round((ROWS - 9 - blockH) / 2) + size * 0.76;
  lines.forEach((l, i) => {
    const w = m.measureText(l).width;
    m.fillText(l, Math.round((COLS - w) / 2), top + i * size * 0.92);
  });
  const a = m.getImageData(0, 0, COLS, ROWS).data;
  const on = (x, y) => a[(y * COLS + x) * 4 + 3] > 110;

  // Red letters: each row, half stitches left to right, then crossed right to left.
  const red = [];
  for (let y = 0; y < ROWS; y++) {
    const xs = [];
    for (let x = 0; x < COLS; x++) if (on(x, y)) xs.push(x);
    if (!xs.length) continue;
    for (const x of xs) red.push([x, y, '/']);
    for (const x of xs.slice().reverse()) red.push([x, y, '\\']);
  }
  // Gold: a small cross-stitch flower in each corner of the frame.
  const gold = [];
  const flower = [[0, -1], [-1, 0], [0, 0], [1, 0], [0, 1]];
  for (const [cx, cy] of [[6, 6], [COLS - 7, 6], [6, ROWS - 14], [COLS - 7, ROWS - 14]]) {
    for (const [dx, dy] of flower) gold.push([cx + dx, cy + dy, '/']);
    for (const [dx, dy] of flower) gold.push([cx + dx, cy + dy, '\\']);
  }
  // Navy running stitch around the edge, two squares on, one off.
  const run = [];
  const x0 = 3, y0 = 3, x1 = COLS - 4, y1 = ROWS - 10;
  const edge = [];
  for (let x = x0; x < x1; x++) edge.push([x, y0, 1, 0]);
  for (let y = y0; y < y1; y++) edge.push([x1, y, 0, 1]);
  for (let x = x1; x > x0; x--) edge.push([x, y1, -1, 0]);
  for (let y = y1; y > y0; y--) edge.push([x0, y, 0, -1]);
  edge.forEach((e, i) => { if (i % 3 !== 2) run.push(e); });
  plan = { red, gold, run, total: red.length + gold.length + run.length };
}
buildPlan();

const jitter = rng(9);
const wob = Array.from({ length: 6000 }, () => (jitter() - 0.5) * 1.6);

function xStitch(x, y, dir, color, hi, i) {
  const p = 3.2, j = wob[i % wob.length];
  const ax = x * C + p, ay = y * C + p, bx = (x + 1) * C - p, by = (y + 1) * C - p;
  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  ctx.lineWidth = 5.2;
  ctx.beginPath();
  if (dir === '/') { ctx.moveTo(ax + j, by); ctx.lineTo(bx, ay + j); } else { ctx.moveTo(ax, ay + j); ctx.lineTo(bx + j, by); }
  ctx.stroke();
  // the sheen along the twist of the thread: a thinner, lighter strand
  ctx.strokeStyle = hi;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  if (dir === '/') { ctx.moveTo(ax + 1 + j, by - 2); ctx.lineTo(bx - 2, ay + 1 + j); } else { ctx.moveTo(ax + 1, ay + 2 + j); ctx.lineTo(bx - 2 + j, by - 1); }
  ctx.stroke();
}
function runStitch(x, y, dx, dy) {
  const cx = x * C + C / 2, cy = y * C + C / 2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = NAVY;
  ctx.lineWidth = 4.4;
  ctx.beginPath();
  ctx.moveTo(cx - dx * (C / 2 - 2), cy - dy * (C / 2 - 2));
  ctx.lineTo(cx + dx * (C / 2 - 2), cy + dy * (C / 2 - 2));
  ctx.stroke();
  ctx.strokeStyle = NAVY_HI;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(cx - dx * (C / 2 - 4), cy - dy * (C / 2 - 4) - 1);
  ctx.lineTo(cx + dx * (C / 2 - 4), cy + dy * (C / 2 - 4) - 1);
  ctx.stroke();
}

function render(t) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(cloth, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = 0.45;
  ctx.drawImage(k.grain, 0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  const f = Math.min(Math.max((t - SEW[0]) / (SEW[1] - SEW[0]), 0), 1);
  let n = Math.floor(f * plan.total), i = 0, tip = null;
  // Sewing order: the frame first, then the flowers, then the words.
  for (const [x, y, dx, dy] of plan.run) { if (i++ >= n) break; runStitch(x, y, dx, dy); tip = [x, y]; }
  for (const [x, y, d] of plan.gold) { if (i++ >= n) break; xStitch(x, y, d, GOLD, GOLD_HI, i); tip = [x, y]; }
  for (const [x, y, d] of plan.red) { if (i++ >= n) break; xStitch(x, y, d, RED, RED_HI, i); tip = [x, y]; }

  // The needle, while it's working.
  if (tip && f < 1) {
    const nx = tip[0] * C + C, ny = tip[1] * C;
    ctx.strokeStyle = '#8c8f94';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(nx + 46, ny - 46); ctx.stroke();
    ctx.strokeStyle = CLOTH;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(nx + 36, ny - 36); ctx.lineTo(nx + 42, ny - 42); ctx.stroke();
  }
  credit(k, 'Sewn one X at a time.', '10', NAVY, 'multiply');
}

let typed = '';
addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && typed.trim()) { word = typed.slice(0, 16); typed = ''; buildPlan(); k.restart(); }
  else if (e.key === 'Backspace') typed = typed.slice(0, -1);
  else if (/^[a-z ]$/i.test(e.key) && !(e.key === 'r' && !typed)) typed += e.key.toUpperCase();
  window.__typing = typed.length > 0;
});

run(k, LOOP, render, '10-stitch');
</script>

<script type="module">
// 08 · DEPARTURES
// A split-flap board, the kind that used to clatter in train stations. Every
// letter has to flip through the alphabet to reach the next one. Today's
// departures are a day: sunrise, coffee, the inbox, the nap that never leaves.
// Type a message and press Enter to put it on the board.
import { setup, credit, makePlate, run, rng, W, H, DISPLAY, TEXT, font } from './lib.js';

const k = await setup();
const { ctx } = k;
const LOOP = 12;
const BOARD = '#0d0d0d', FLAP = '#242424', WHITE = '#efe9dc', AMBER = '#f2ae2e';
const CH = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:.-?!';
const COLS = 22, ROWS = 7, CW = 42, CHH = 84, GAP = 4;
const BX = (W - (COLS * (CW + GAP) - GAP)) / 2, BY = 300;
const STEP = 0.042;
const STATUS_COL = 15; // status column is amber

const row = (time, dest, status) => (time.padEnd(5) + ' ' + dest.padEnd(8) + ' ' + status.padEnd(7)).slice(0, COLS);
const blank = Array(ROWS).fill(' '.repeat(COLS));
const DAY = [
  row('06:40', 'SUNRISE', 'ON TIME'),
  row('08:15', 'COFFEE', 'ON TIME'),
  row('09:30', 'INBOX', 'DELAYED'),
  row('12:45', 'LUNCH', 'ON TIME'),
  row('15:00', 'NAP', 'GONE'),
  row('18:20', 'GOLDEN', 'ON TIME'),
  row('23:30', 'SLEEP', 'LATE'),
];
const LATER = [
  row('06:40', 'SUNRISE', 'GONE'),
  row('08:15', 'COFFEE', 'GO NOW'),
  row('09:30', 'INBOX', 'LATER'),
  row('12:45', 'LUNCH', 'ON TIME'),
  row('15:00', 'NAP', 'GONE'),
  row('18:20', 'GOLDEN', 'ON TIME'),
  row('23:30', 'SLEEP', 'LATE'),
];
let SCENES = [{ at: 0, rows: blank }, { at: 0.6, rows: DAY }, { at: 6.4, rows: LATER }, { at: 9.6, rows: blank }];

// Each flap is pre-drawn once per character and colour.
const atlas = new Map();
function glyph(c, color) {
  const key = c + color;
  if (atlas.has(key)) return atlas.get(key);
  const g = makePlate(CW, CHH), x = g.getContext('2d');
  x.fillStyle = FLAP;
  x.beginPath();
  x.roundRect(0, 0, CW, CHH, 4);
  x.fill();
  x.fillStyle = color;
  x.font = font(DISPLAY, 64);
  x.textAlign = 'center';
  x.textBaseline = 'alphabetic';
  x.fillText(c, CW / 2, CHH / 2 + 24);
  atlas.set(key, g);
  return g;
}

// Stagger so the board ripples instead of flipping all at once.
const r = rng(5);
const delay = Array.from({ length: ROWS * COLS }, (_, i) => (i % COLS) * 0.016 + Math.floor(i / COLS) * 0.05 + r() * 0.06);

// Pure function of time: which character, and how far through its flip.
function cellAt(t, i) {
  let s = 0;
  for (let j = 0; j < SCENES.length; j++) if (SCENES[j].at <= t) s = j;
  const ri = Math.floor(i / COLS), ci = i % COLS;
  const target = CH.indexOf(SCENES[s].rows[ri][ci].toUpperCase());
  const prev = s > 0 ? CH.indexOf(SCENES[s - 1].rows[ri][ci].toUpperCase()) : target;
  const to = target < 0 ? 0 : target, from = prev < 0 ? 0 : prev;
  const n = (to - from + CH.length) % CH.length;
  const el = t - SCENES[s].at - delay[i];
  if (n === 0 || el < 0) return [from, from, 0];
  const kk = Math.floor(el / STEP);
  if (kk >= n) return [to, to, 0];
  return [(from + kk) % CH.length, (from + kk + 1) % CH.length, (el - kk * STEP) / STEP];
}

function drawCell(x, y, cur, nxt, f, color) {
  const a = glyph(CH[cur], color), b = glyph(CH[nxt], color), h2 = CHH / 2;
  // top half: the next letter waiting behind; bottom half: the current one
  ctx.drawImage(f > 0 ? b : a, 0, 0, CW, h2, x, y, CW, h2);
  ctx.drawImage(a, 0, h2, CW, h2, x, y + h2, CW, h2);
  if (f > 0) {
    const c = Math.cos(f * Math.PI);
    if (c > 0) {
      // current top half folding down toward the hinge
      const hh = h2 * c;
      ctx.drawImage(a, 0, 0, CW, h2, x, y + h2 - hh, CW, hh);
      ctx.fillStyle = `rgba(0,0,0,${(0.35 * (1 - c)).toFixed(3)})`;
      ctx.fillRect(x, y + h2 - hh, CW, hh);
    } else {
      // next bottom half dropping into place
      const hh = h2 * -c;
      ctx.drawImage(b, 0, h2, CW, h2, x, y + h2, CW, hh);
      ctx.fillStyle = `rgba(0,0,0,${(0.35 * (1 + c)).toFixed(3)})`;
      ctx.fillRect(x, y + h2, CW, hh);
    }
  }
  ctx.fillStyle = BOARD;
  ctx.fillRect(x, y + h2 - 1, CW, 2); // the hinge
}

let manualAt = null;
function render(tLoop) {
  const t = manualAt === null ? tLoop : (performance.now() - manualAt) / 1000;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = BOARD;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.05;
  ctx.globalCompositeOperation = 'screen';
  ctx.drawImage(k.grain, 0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = WHITE;
  ctx.font = font(DISPLAY, 176);
  ctx.fillText('DEPARTURES', BX - 4, 236);
  ctx.font = font(TEXT, 24);
  ctx.fillStyle = WHITE;
  const labels = [['TIME', 0], ['TO', 6], ['STATUS', STATUS_COL]];
  for (const [l, c] of labels) ctx.fillText(l, BX + c * (CW + GAP), BY - 16);

  for (let i = 0; i < ROWS * COLS; i++) {
    const ci = i % COLS, ri = Math.floor(i / COLS);
    const [cur, nxt, f] = cellAt(t, i);
    drawCell(BX + ci * (CW + GAP), BY + ri * (CHH + 14), cur, nxt, f, ci >= STATUS_COL ? AMBER : WHITE);
  }

  ctx.fillStyle = AMBER;
  ctx.font = font(DISPLAY, 64);
  ctx.fillText('ALL TIMES ARE TODAY.', BX - 2, 1110);
  credit(k, 'Every letter flips through the alphabet to get there.', '08', WHITE, 'source-over');
}

// Type a message, Enter to send it to the board.
let typed = '';
function wrap(msg) {
  const words = msg.toUpperCase().split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  for (const w of words) {
    if ((line + ' ' + w).trim().length > COLS) { lines.push(line); line = w; } else line = (line + ' ' + w).trim();
  }
  if (line) lines.push(line);
  const top = Math.max(0, Math.floor((ROWS - lines.length) / 2));
  return Array.from({ length: ROWS }, (_, i) => {
    const l = (lines[i - top] || '').slice(0, COLS);
    const pad = Math.floor((COLS - l.length) / 2);
    return (' '.repeat(pad) + l).padEnd(COLS);
  });
}
addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && typed.trim()) {
    const now = manualAt === null ? null : (performance.now() - manualAt) / 1000;
    const showing = SCENES.filter((s) => s.at <= (now ?? 9)).pop().rows;
    SCENES = [{ at: 0, rows: showing }, { at: 0.2, rows: wrap(typed) }];
    manualAt = performance.now();
    typed = '';
  } else if (e.key === 'Backspace') typed = typed.slice(0, -1);
  else if (e.key.length === 1 && CH.includes(e.key.toUpperCase()) && !(e.key.toLowerCase() === 'r' && !typed)) typed += e.key;
  window.__typing = typed.length > 0;
});

run(k, LOOP, render, '08-departures');
</script>

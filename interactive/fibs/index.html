<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIBS — 100% artificial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  /* The stage is always 4:5 and sized in CSS so type scales with it (cqw units). */
  #stage { position: relative; width: min(100vw, 80vh); aspect-ratio: 4 / 5; margin: 0 auto; overflow: hidden; container-type: inline-size; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .t { position: absolute; color: #ff2a86; font-family: 'Bagel Fat One', system-ui, sans-serif; line-height: 0.92; letter-spacing: -0.01em; opacity: 0; will-change: transform, opacity; }
  .mono { font-family: 'DM Mono', ui-monospace, monospace; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.5; }
  .ink { color: #1b1230; }
  .w { display: inline-block; opacity: 0; transform-origin: 50% 80%; }
  .c { left: 0; right: 0; text-align: center; }
  /* play mode (?play=1): the pack shot runs live and the visitor moves the seam */
  body.play { background: #fbf5ef; }
  body.play #stage { width: 100vw; touch-action: pan-y; cursor: ew-resize; user-select: none; -webkit-user-select: none; }
  #knob { display: none; position: absolute; top: 50%; width: 11cqw; height: 11cqw; margin: -5.5cqw 0 0 -5.5cqw; border-radius: 50%; background: #fff; box-shadow: 0 0.6cqw 2.4cqw rgba(20, 10, 40, 0.28); align-items: center; justify-content: center; font: 500 4.2cqw/1 'DM Mono', monospace; color: #1b1230; pointer-events: none; }
  body.play #knob { display: flex; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script src="timeline.js"></script>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <!-- shot A -->
  <div id="a-mark" class="t" style="left:6cqw; top:5cqw; font-size:6.4cqw;">FIBS</div>
  <div id="a-flav" class="t mono ink" style="right:6cqw; top:6.6cqw; font-size:2.1cqw;">Blue raspberry</div>
  <div id="a-head" class="t" style="left:6cqw; bottom:6.5cqw; font-size:11.6cqw; opacity:1;"></div>
  <!-- shot B -->
  <div id="b-mark" class="t c" style="top:3.5cqw; font-size:25cqw;">FIBS</div>
  <div id="b-line1" class="t c" style="bottom:5.5cqw; font-size:8.2cqw;">100% artificial.</div>
  <div id="b-line2" class="t c" style="bottom:9.5cqw; font-size:8.2cqw;">So is this ad.</div>
  <div id="b-credit" class="t c mono" style="bottom:5cqw; font-size:2.1cqw; mix-blend-mode:difference; color:#fff;">Every pixel is code &nbsp;·&nbsp; <span id="tris">0</span> triangles &nbsp;·&nbsp; 0 cameras</div>
  <div id="knob" aria-hidden="true">↔</div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const TL = globalThis.TL;
const Q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const PLAY = Q.has('play');
if (PLAY) document.body.classList.add('play');

// ---------- art direction ----------
const PAPER = new THREE.Color('#fbf5ef');         // the seamless: pale, so every colour comes from the jelly
const WIRE_BG = new THREE.Color('#0c0a12');
const FLAVOURS = { blue: '#1648ff', cherry: '#ff0f3a', lemon: '#ffcf00', lime: '#3fd400', orange: '#ff6a00', grape: '#8b24e8' };
const KEY_DIR = new THREE.Vector3(-0.55, 1, -0.35).normalize();   // where the key light sits; pools fall opposite
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const backOut = (x) => { x = clamp(x); const c = 2.2; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const track = (keys, t) => {                       // piecewise eased [time, value] pairs
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
    return v0 + (v1 - v0) * smooth((t - t0) / (t1 - t0));
  }
  return keys[keys.length - 1][1];
};

// ---------- renderer ----------
const stage = $('stage'), canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.38;
renderer.setPixelRatio(+(Q.get('dpr') || Math.min(devicePixelRatio, PLAY ? 1.5 : 2)));

const scene = new THREE.Scene();
scene.background = PAPER.clone();
scene.fog = new THREE.Fog(scene.background, 14, 34);

// ---------- studio: softboxes built in code, baked to an environment ----------
{
  const env = new THREE.Scene();
  env.background = new THREE.Color(0x101014);
  const box = (w, h, pos, intensity, tint = 0xffffff) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(tint).multiplyScalar(intensity), side: THREE.DoubleSide }));
    m.position.copy(pos); m.lookAt(0, 0.5, 0); env.add(m);
  };
  box(7, 5, new THREE.Vector3(-6, 7, -3.5), 9);                  // key: big soft source, back left
  box(1.2, 8, new THREE.Vector3(7, 3.5, 1.5), 7);                // rim strip, right
  box(5, 2, new THREE.Vector3(1.5, 3, 8), 1.6);                  // low front fill
  box(10, 10, new THREE.Vector3(0, 10, 0), 0.5);                 // overhead, kept low so tops don't mirror a flat panel
  box(30, 30, new THREE.Vector3(0, -3, 0), 1.3, PAPER.getHex()); // the floor bouncing back up
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(env, 0.03).texture;
}
const key = new THREE.DirectionalLight(0xffffff, 1.15);
key.position.copy(KEY_DIR).multiplyScalar(12);
scene.add(key);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: PAPER, roughness: 0.6, envMapIntensity: 0.5 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// ---------- jelly ----------
// A pillowed cube (superellipsoid): no flat faces, so highlights roll like a real gummy instead of a keycap.
function pillow(seg, p = 4.2) {
  const g = new THREE.BoxGeometry(1, 1, 1, seg, seg, seg);
  const pos = g.attributes.position, nor = g.attributes.normal, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const r = Math.pow(Math.abs(v.x) ** p + Math.abs(v.y) ** p + Math.abs(v.z) ** p, 1 / p);
    v.multiplyScalar(0.5 / r); pos.setXYZ(i, v.x, v.y, v.z);
    nor.setXYZ(i, Math.sign(v.x) * Math.abs(v.x) ** (p - 1), Math.sign(v.y) * Math.abs(v.y) ** (p - 1), Math.sign(v.z) * Math.abs(v.z) ** (p - 1));
  }
  g.normalizeNormals(); return g;
}
const jellyGeo = pillow(28), wireGeo = pillow(5);
const jellyMat = (hex) => new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(hex).lerp(new THREE.Color(0xffffff), 0.55), roughness: 0.13, metalness: 0,
  transmission: 1, thickness: 0.9, ior: 1.38,
  attenuationColor: new THREE.Color(hex), attenuationDistance: 1.1,
  emissive: new THREE.Color(hex), emissiveIntensity: 0.1,          // a little light held inside the body
  clearcoat: 0.6, clearcoatRoughness: 0.12, envMapIntensity: 1.0, specularIntensity: 0.9,
});
const mats = Object.fromEntries(Object.entries(FLAVOURS).map(([k, v]) => [k, jellyMat(v)]));
mats.blue.attenuationDistance = 1.0; mats.blue.emissiveIntensity = 0.2; mats.blue.color.set('#1648ff').lerp(new THREE.Color(0xffffff), 0.3);
mats.grape.attenuationDistance = 1.6; mats.grape.emissiveIntensity = 0.18;

// The light that passes through a jelly lands on the floor as a pool of its colour.
const radial = (stops) => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  stops.forEach(([o, a]) => gr.addColorStop(o, `rgba(255,255,255,${a})`));
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
};
const poolTex = radial([[0, 1], [0.25, 0.85], [0.6, 0.3], [1, 0]]);
const contactTex = radial([[0, 0.75], [0.55, 0.45], [1, 0]]);
const flat = new THREE.PlaneGeometry(1, 1);

const shots = { A: new THREE.Group(), B: new THREE.Group() };
scene.add(shots.A, shots.B);
const jellies = [];

// A jelly is described once; where it is at time t is worked out from that, so any frame can be drawn on its own.
const DROP_H = 7.5, DAMP = 5.2, FREQ = 21;
function addJelly(shot, flavour, x, z, drop, fall, { yaw = 0, size = 1, hit = 0.3 } = {}) {
  const col = new THREE.Color(FLAVOURS[flavour]);
  const mesh = new THREE.Mesh(jellyGeo, mats[flavour]);
  const pool = new THREE.Mesh(flat, new THREE.MeshBasicMaterial({ map: poolTex, color: col.clone().lerp(new THREE.Color(0xffffff), 0.18), transparent: true, depthWrite: false }));
  const contact = new THREE.Mesh(flat, new THREE.MeshBasicMaterial({ map: contactTex, color: col.clone().multiplyScalar(0.35), transparent: true, depthWrite: false }));
  pool.rotation.x = contact.rotation.x = -Math.PI / 2;
  pool.renderOrder = 1; contact.renderOrder = 2;
  shots[shot].add(mesh, pool, contact);
  const j = { mesh, pool, contact, x, z, drop, fall, land: drop + fall, yaw, size, hit,
    spin: [(rnd() - 0.5) * 1.4, (rnd() - 0.5) * 1.2, (rnd() - 0.5) * 1.4], phase: rnd() * 6.28, nudges: [] };
  jellies.push(j); return j;
}
function poseJelly(j, t) {
  const u = (t - j.drop) / j.fall;
  const on = u >= 0; j.mesh.visible = j.pool.visible = j.contact.visible = on;
  if (!on) return;
  let y = 0, s = 1, loose = 0;
  if (u < 1) { y = DROP_H * (1 - u * u); s = 1 + 0.14 * u; loose = 1 - u; }             // falling: stretches a little
  else {
    const q = t - j.land;                                                               // landed: squash, then a damped wobble
    s = 1 - j.hit * Math.exp(-DAMP * q) * Math.cos(FREQ * q) + 0.005 * Math.sin(t * 2.1 + j.phase);
    for (const [at, amp] of j.nudges) if (t > at) s -= amp * Math.exp(-DAMP * (t - at)) * Math.sin(FREQ * (t - at));
  }
  const wide = 1 / Math.sqrt(s);                                                        // volume stays the same
  j.mesh.scale.set(j.size * wide, j.size * s, j.size * wide);
  j.mesh.position.set(j.x, y + (j.size * s) / 2, j.z);
  j.mesh.rotation.set(j.spin[0] * loose, j.yaw + j.spin[1] * loose, j.spin[2] * loose);
  // higher off the floor = wider, fainter pool
  const fx = -KEY_DIR.x * (0.55 + y * 0.9) * j.size, fz = -KEY_DIR.z * (0.55 + y * 0.9) * j.size;
  j.pool.position.set(j.x + fx, 0.004, j.z + fz);
  j.pool.scale.setScalar(j.size * (2.9 + y * 1.2) * (0.9 + 0.1 * wide));
  j.pool.material.opacity = 0.92 / (1 + y * 0.9);
  j.contact.position.set(j.x + fx * 0.12, 0.006, j.z + fz * 0.12);
  j.contact.scale.setScalar(j.size * (1.45 + y) * wide);
  j.contact.material.opacity = 0.55 / (1 + y * 3);
}

// ---------- cast ----------
const heroA = addJelly('A', 'blue', 0, 0, TL.heroA.drop, TL.heroA.fall, { yaw: 0.6, size: 1.1, hit: 0.34 });
TL.backA.forEach((b) => addJelly('A', b.f, b.x, b.z, b.drop, TL.fall, { yaw: rnd() * 3 }));

const S = 1.7;
TL.grid.forEach((g) => addJelly('B', g.f, (g.c - 1) * S, (g.r - 1) * S, g.drop, TL.fall, { yaw: (rnd() - 0.5) * 0.16 }));
const heroB = addJelly('B', 'blue', 0, 0, TL.heroB.drop, TL.heroB.fall, { yaw: 0.12, hit: 0.36 });
// when the blue one lands, the shock runs outward through the other eight
jellies.filter((j) => j.mesh.parent === shots.B && j !== heroB).forEach((j) => j.nudges.push([heroB.land + Math.hypot(j.x, j.z) * 0.045, 0.13]));
// and they all jump once more when the picture comes back
jellies.filter((j) => j.mesh.parent === shots.B).forEach((j) => j.nudges.push([TL.wipe[5][0] - 0.1 + (j.x + 2) * 0.03, 0.1]));

// ---------- camera ----------
const camera = new THREE.PerspectiveCamera(26, 4 / 5, 0.1, 100);
const shake = (t, at, amp) => (t > at ? amp * Math.exp(-9 * (t - at)) * Math.sin(38 * (t - at)) : 0);
function poseCamera(t) {
  if (t < TL.cut) {
    const k = smooth(t / TL.cut);                                    // slow push in on the hero
    camera.fov = 24;
    camera.position.set(3.95 - 0.35 * k, 1.8 - 0.1 * k + shake(t, heroA.land, 0.05), 7.2 - 0.6 * k);
    camera.lookAt(0.25, 0.42, 0);
    return { focus: camera.position.distanceTo(new THREE.Vector3(0, 0.5, 0.2)), aperture: 0.0016, maxblur: 0.012 };
  }
  const a = 0.05 * Math.sin((t - TL.cut) * 0.55 - 0.6);              // a slow drift, so the wireframe half is visibly live
  camera.fov = 27;
  camera.position.set(Math.sin(a) * 7.6, 12.6 + shake(t, heroB.land, 0.07), Math.cos(a) * 7.6);
  camera.lookAt(0, 0, -0.55);
  return { focus: camera.position.distanceTo(new THREE.Vector3(0, 0.6, 0)), aperture: 0.00012, maxblur: 0.004 };
}

// ---------- post: lens blur, then tone map, then grain + vignette ----------
const composer = new EffectComposer(renderer);
composer.renderTarget1.samples = 4; composer.renderTarget2.samples = 4;
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 8, aperture: 0.001, maxblur: 0.01 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());
const finish = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uGrain: { value: 0.03 }, uVig: { value: 0.16 }, uT: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uGrain, uVig, uT; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      c.rgb *= 1.0 - uVig * smoothstep(0.35, 0.95, distance(vUv, vec2(0.5, 0.52)));
      c.rgb += (h(gl_FragCoord.xy + fract(uT) * 91.7) - 0.5) * uGrain;
      gl_FragColor = c;
    }`,
});
composer.addPass(finish);

// ---------- the reveal: everything right of the seam drawn as what it is ----------
const wireMat = new THREE.MeshBasicMaterial({ color: 0xff5fa5, wireframe: true, toneMapped: false });
const gridScene = new THREE.Scene(); gridScene.add(new THREE.GridHelper(80, 94, 0x6b3a6f, 0x3a2748));
function drawWire(w, h, seam) {
  const x = Math.round(w * seam);
  if (x >= w) return;
  const bg = scene.background, fog = scene.fog;
  scene.background = WIRE_BG; scene.fog = null; scene.overrideMaterial = wireMat; floor.visible = false;
  jellies.forEach((j) => { j.mesh.geometry = wireGeo; j.pool.visible = j.contact.visible = false; });
  renderer.setRenderTarget(null);
  renderer.setScissorTest(true); renderer.setScissor(x, 0, w - x, h); renderer.setViewport(0, 0, w, h);
  renderer.render(scene, camera);
  renderer.autoClear = false; renderer.render(gridScene, camera); renderer.autoClear = true;
  if (x > 1) { renderer.setScissor(x - 1, 0, 2, h); renderer.setClearColor(0xffffff, 1); renderer.clear(true, false, false); }   // the seam
  renderer.setScissorTest(false);
  scene.background = bg; scene.fog = fog; scene.overrideMaterial = null; floor.visible = true;
  jellies.forEach((j) => { j.mesh.geometry = jellyGeo; });
}

// ---------- type ----------
const head = $('a-head');
TL.headline.forEach((h, i) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = h.w; head.append(s, i === 1 ? document.createElement('br') : ' '); h.el = s; });
const pop = (el, t, at, out = Infinity) => {                        // scale up past full size and settle; shrink away on the way out
  const k = (t - at) / 0.36, o = (t - out) / 0.12;
  const s = t < out ? backOut(k) : 1 - smooth(o);
  el.style.opacity = t < at || o >= 1 ? 0 : clamp(k / 0.25);
  el.style.transform = `scale(${Math.max(0.001, s).toFixed(4)})`;
};
$('tris').textContent = (jellies.filter((j) => j.mesh.parent === shots.B).length * jellyGeo.index.count / 3 + 2).toLocaleString('en-US');
function poseType(t) {
  const A = t < TL.cut;
  $('a-mark').style.opacity = $('a-flav').style.opacity = A ? clamp(t / 0.25) : 0;
  TL.headline.forEach((h) => pop(h.el, A ? t : -1, h.at));
  pop($('b-mark'), A ? -1 : t, TL.wordmark);
  pop($('b-line1'), A ? -1 : t, TL.line1, TL.swap - 0.12);
  pop($('b-line2'), A ? -1 : t, TL.swap + 0.02);
  pop($('b-credit'), A ? -1 : t, TL.credit);
}

// ---------- draw one moment ----------
function size() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (canvas.width !== Math.round(w * renderer.getPixelRatio()) || canvas.height !== Math.round(h * renderer.getPixelRatio())) { renderer.setSize(w, h, false); composer.setSize(w, h); }
  bokeh.uniforms.aspect.value = w / h;
  return [w, h];
}
function draw(t) {
  const [w, h] = size();
  shots.A.visible = t < TL.cut; shots.B.visible = !shots.A.visible;
  jellies.forEach((j) => poseJelly(j, t));
  const lens = poseCamera(t); camera.updateProjectionMatrix();
  bokeh.uniforms.focus.value = lens.focus; bokeh.uniforms.aperture.value = lens.aperture; bokeh.uniforms.maxblur.value = lens.maxblur;
  finish.uniforms.uT.value = t * 7.31;
  composer.render();
  drawWire(w, h, PLAY ? playSeam(t) : track(TL.wipe, t));
  poseType(t);
}

// ---------- play mode: the seam belongs to whoever is looking ----------
let seamNow = 1, seamWant = 0.5, touched = false;
function playSeam(t) {
  if (!touched && t < TL.wipe[1][0]) seamNow = track(TL.wipe.slice(0, 2), t);   // it opens by itself the first time
  else seamNow += (seamWant - seamNow) * 0.2;
  $('knob').style.left = (seamNow * 100).toFixed(2) + '%';
  $('knob').style.opacity = t > TL.wipe[0][0] || touched ? 1 : 0;
  return seamNow;
}

await document.fonts.ready;
// ?drive=1: nothing plays; the exporter asks for each frame by time. ?t=5: one still. Otherwise it loops.
window.__draw = (t) => new Promise((res) => { draw(t); requestAnimationFrame(() => res(true)); });
if (Q.has('t')) { draw(+Q.get('t')); requestAnimationFrame(() => draw(+Q.get('t'))); }
else if (PLAY) {
  const B = jellies.filter((j) => j.mesh.parent === shots.B);
  let t = TL.cut, last = performance.now(), seen = true, downX = 0;
  const aim = (e) => { const r = stage.getBoundingClientRect(); seamWant = clamp((e.clientX - r.left) / r.width, 0.05, 0.95); touched = true; };
  stage.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons) aim(e); });
  stage.addEventListener('pointerdown', (e) => { downX = e.clientX; aim(e); });
  stage.addEventListener('pointerup', (e) => { if (Math.abs(e.clientX - downX) < 6 && t > heroB.land) B.forEach((j) => j.nudges.push([t + Math.hypot(j.x, j.z) * 0.03, 0.14])); });   // a tap makes them all jump
  new IntersectionObserver(([e]) => { seen = e.isIntersecting; }).observe(stage);
  const loop = (n) => { const dt = Math.min(0.05, (n - last) / 1000); last = n; if (seen) { t += dt; draw(t); } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
else if (!Q.has('drive')) { const t0 = performance.now(); const loop = (n) => { draw(((n - t0) / 1000) % (TL.dur + 1)); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
document.title = 'ready';
</script>
</body>
</html>

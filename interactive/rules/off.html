<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Tin Moon Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ece4d3;
    --paper-deep: #e2d8c3;
    --ink: #1c1a16;
    --ink-soft: #57524a;
    --vinyl: #141311;
    --accent: #d4502a;
    --tin-hi: #f6f5f0;
    --tin-mid: #b8b9b3;
    --tin-lo: #6f716d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 1280px;
    height: 800px;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    position: relative;
    width: 1280px;
    height: 800px;
    overflow: hidden;
    background:
      radial-gradient(1200px 700px at 0% 0%, #f3ecdd 0%, transparent 60%),
      linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
  }

  /* ---------- Record ---------- */
  .record {
    position: absolute;
    width: 860px;
    height: 860px;
    left: 760px;
    top: -30px;
    border-radius: 50%;
    background:
      radial-gradient(circle, transparent 0 152px, #0c0b0a 152px 160px, transparent 160px),
      repeating-radial-gradient(circle, #161513 0 1.5px, #1d1c19 1.5px 3px),
      var(--vinyl);
    box-shadow:
      0 0 0 10px rgba(28,26,22,.04),
      -30px 40px 80px rgba(40,30,15,.28);
  }
  /* gap tracks between songs */
  .record::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle,
        transparent 0 238px, #0a0909 238px 241px,
        transparent 241px 300px, #0a0909 300px 302px,
        transparent 302px 352px, #0a0909 352px 354px,
        transparent 354px 398px, #0a0909 398px 400px,
        transparent 400px);
  }
  /* static light sheen across the grooves */
  .record::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 200deg,
      transparent 0deg,
      rgba(255,248,230,.10) 18deg,
      transparent 40deg,
      transparent 180deg,
      rgba(255,248,230,.07) 198deg,
      transparent 222deg,
      transparent 360deg);
  }

  /* The label: a tin moon */
  .label {
    position: absolute;
    z-index: 2;
    width: 300px;
    height: 300px;
    left: calc(50% - 150px);
    top: calc(50% - 150px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 62% 38%, rgba(0,0,0,.10) 0 14px, transparent 15px),
      radial-gradient(circle at 40% 64%, rgba(0,0,0,.08) 0 22px, transparent 23px),
      radial-gradient(circle at 70% 70%, rgba(0,0,0,.07) 0 9px, transparent 10px),
      radial-gradient(circle at 30% 34%, rgba(0,0,0,.06) 0 8px, transparent 9px),
      radial-gradient(circle at 34% 28%, var(--tin-hi) 0%, var(--tin-mid) 45%, var(--tin-lo) 85%, #4f514e 100%);
    box-shadow:
      inset -26px -18px 50px rgba(20,19,17,.45),
      inset 10px 8px 24px rgba(255,255,255,.35);
  }
  .ring {
    position: absolute;
    inset: 0;
    animation: spin 18s linear infinite;
  }
  .ring text {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13.5px;
    letter-spacing: 3.2px;
    fill: rgba(28,26,22,.78);
    text-transform: uppercase;
  }
  .spindle {
    position: absolute;
    width: 16px;
    height: 16px;
    left: calc(50% - 8px);
    top: calc(50% - 8px);
    border-radius: 50%;
    background: var(--paper);
    box-shadow: inset 0 2px 3px rgba(0,0,0,.45);
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }

  /* Friday sticker */
  .sticker {
    position: absolute;
    z-index: 3;
    left: 706px;
    top: 548px;
    width: 148px;
    height: 148px;
    border-radius: 50%;
    background: var(--accent);
    color: #fbf3e4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform: rotate(-12deg);
    box-shadow: 0 10px 24px rgba(120,40,10,.28);
  }
  .sticker::before {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    border: 1px dashed rgba(251,243,228,.6);
  }
  .sticker .s-top {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .sticker .s-big {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 500;
    font-size: 30px;
    line-height: 1;
    margin: 6px 0 5px;
  }

  /* ---------- Header ---------- */
  .top {
    position: absolute;
    left: 80px;
    right: 80px;
    top: 44px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .mark {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--tin-hi), var(--tin-mid) 50%, var(--tin-lo));
    box-shadow: inset -5px -3px 6px rgba(20,19,17,.35), 0 0 0 1.5px var(--ink);
  }
  .name {
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: -.2px;
  }
  .name em { font-weight: 300; }

  /* ---------- Copy ---------- */
  .copy {
    position: absolute;
    left: 80px;
    top: 178px;
    width: 640px;
  }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    letter-spacing: 2.6px;
    text-transform: uppercase;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 26px;
  }
  .eyebrow::before {
    content: "";
    width: 28px;
    height: 1px;
    background: var(--ink-soft);
  }
  h1 {
    font-family: "Fraunces", serif;
    font-optical-sizing: auto;
    font-weight: 300;
    font-size: 88px;
    line-height: .98;
    letter-spacing: -2.6px;
    margin: 0;
  }
  h1 em {
    font-style: italic;
    color: var(--accent);
  }
  .sub {
    font-family: "Fraunces", serif;
    font-weight: 300;
    font-size: 21px;
    line-height: 1.5;
    color: var(--ink-soft);
    max-width: 540px;
    margin: 30px 0 40px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 18px 28px 18px 30px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 999px;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    text-decoration: none;
    transition: background .2s ease, transform .2s ease;
  }
  .btn .arrow {
    display: inline-block;
    transition: transform .2s ease;
  }
  .btn:hover { background: var(--accent); }
  .btn:hover .arrow { transform: translateX(4px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  /* ---------- Footer line ---------- */
  .info {
    position: absolute;
    left: 80px;
    bottom: 48px;
    width: 600px;
    padding-top: 18px;
    border-top: 1px solid rgba(28,26,22,.25);
    display: flex;
    gap: 28px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    letter-spacing: 1.2px;
    color: var(--ink);
  }
  .info span { display: inline-flex; align-items: center; gap: 10px; }
  .info .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }
</style>
</head>
<body>
  <main class="hero">

    <div class="record" aria-hidden="true">
      <div class="label">
        <svg class="ring" viewBox="0 0 300 300" width="300" height="300">
          <defs>
            <path id="circ" d="M150,150 m-118,0 a118,118 0 1,1 236,0 a118,118 0 1,1 -236,0"/>
          </defs>
          <text><textPath href="#circ">Tin Moon Records · Side A · New &amp; Used Vinyl · Highland Park ·</textPath></text>
        </svg>
        <div class="spindle"></div>
      </div>
    </div>

    <div class="sticker" aria-hidden="true">
      <span class="s-top">Every</span>
      <span class="s-big">Friday</span>
      <span class="s-top">Free listening</span>
    </div>

    <header class="top">
      <span class="mark" aria-hidden="true"></span>
      <span class="name">Tin Moon <em>Records</em></span>
    </header>

    <section class="copy">
      <p class="eyebrow">Independent record shop</p>
      <h1>Dig the crates.<br>Stay for the <em>B&#8209;side.</em></h1>
      <p class="sub">New and used vinyl, hand-picked in Highland Park — plus free listening sessions every Friday night.</p>
      <a class="btn" href="#visit">Visit the shop <span class="arrow">→</span></a>
    </section>

    <footer class="info">
      <span><i class="dot"></i>Tue–Sun, 11–8</span>
      <span>Highland Park, Los Angeles</span>
    </footer>

  </main>
</body>
</html>
